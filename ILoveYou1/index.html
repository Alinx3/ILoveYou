<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Interactive Blood Rain Scene</title>
    
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'VT323', monospace;
            touch-action: none;
            background-color: black; /* Base color */
        }

        /* --- SCENE 1: THE GENERATED SCENE --- */
        #scene-boat {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Creating the retro horizontal scanlines using CSS */
            background-color: #5c2323;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 4px,
                rgba(0, 0, 0, 0.15) 4px,
                rgba(0, 0, 0, 0.15) 8px
            );
            transition: opacity 1.5s ease;
            z-index: 1;
        }

        /* The pure-code Boat and Guy */
        #coded-boat {
            position: absolute;
            bottom: 25%; /* Anchored near the water line */
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: auto;
            z-index: 2;
            /* Gentle bobbing animation */
            animation: bobbing 3s ease-in-out infinite;
        }

        @keyframes bobbing {
            0%, 100% { transform: translate(-50%, 0px); }
            50% { transform: translate(-50%, 8px); }
        }

        /* Canvas for Rain and the Blood Water */
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3; /* Placed ABOVE the boat so water covers the hull */
            pointer-events: none;
        }

        /* The text container */
        #text-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4d4d4;
            font-size: 2.2rem;
            line-height: 1.3;
            text-align: center;
            z-index: 4;
            pointer-events: none;
            text-shadow: 2px 2px 0px #000;
        }

        /* --- SCENE 2: THE CROSS --- */
        #scene-cross {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease;
            z-index: 10;
        }

        #scene-cross img {
            max-width: 80%;
            max-height: 80vh;
            image-rendering: pixelated;
        }

        /* Transitions */
        .fade-out { opacity: 0 !important; }
        .fade-in { opacity: 1 !important; pointer-events: all !important; }

        @media (max-width: 600px) {
            #text-container { font-size: 1.6rem; top: 35%; }
            #coded-boat { width: 180px; bottom: 27%; }
        }

        
        .text-line {
            display: inline-block;

            /* Estado inicial: texto deformado */
            opacity: 0;
            transform: scaleX(1.8) scaleY(0.45);

            animation: textRender 0.05s steps(5, end) forwards;
            transform-origin: center;
        }

        @keyframes textRender {
            0% {
                opacity: 0;
                transform: scaleX(1.8) scaleY(0.45);
            }

            20% {
                opacity: 1;
                transform: scaleX(1.45) scaleY(0.65);
            }

            40% {
                transform: scaleX(1.18) scaleY(0.82);
            }

            60% {
                transform: scaleX(0.92) scaleY(1.08);
            }

            80% {
                transform: scaleX(1.04) scaleY(0.97);
            }

            100% {
                opacity: 1;
                transform: scaleX(1) scaleY(1);
            }
        }

        #scene-cross img {
            max-width: 80%;
            max-height: 80vh;
            image-rendering: pixelated;

            animation: crossFloat 3s ease-in-out infinite;
        }

        @keyframes crossFloat {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }

            25% {
                transform: translateY(-5px) rotate(-1deg);
            }

            50% {
                transform: translateY(0px) rotate(0deg);
            }

            75% {
                transform: translateY(5px) rotate(1deg);
            }
        }
    </style>
</head>
<body>

    <!-- Scene 1: Code-Generated Boat, Water, Rain, and Text -->
    <div id="scene-boat">
        
        <!-- Inline pixel-art style SVG of the guy in the boat -->

        <!-- Canvas generating BOTH Rain and Water to borders -->
        <canvas id="fx-canvas"></canvas>
        <div id="text-container"></div>
    </div>

    <!-- Scene 2: Black screen and Cross -->
    <div id="scene-cross">
        <!-- YOUR CROSS IMAGE -->
        <img src="cross.png" alt="Cross Scene">
    </div>

    <script>
        // --- RAIN AND WATER CANVAS LOGIC ---
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let rainDrops = [];
        let waveTime = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initRain() {
            const dropCount = window.innerWidth < 600 ? 60 : 150;
            for (let i = 0; i < dropCount; i++) {
                rainDrops.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    length: Math.random() * 20 + 10,
                    speed: Math.random() * 12 + 15
                });
            }
        }
        initRain();

        function drawFX() {
            // Clear entire canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. DRAW RAIN
            ctx.strokeStyle = 'rgba(214, 0, 0, 0.7)'; // Blood red rain
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';

            for (let i = 0; i < rainDrops.length; i++) {
                let drop = rainDrops[i];
                ctx.beginPath();
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x, drop.y + drop.length);
                ctx.stroke();

                // Move drop down
                drop.y += drop.speed;
                // Reset drop to the top
                if (drop.y > canvas.height) {
                    drop.y = -drop.length;
                    drop.x = Math.random() * canvas.width;
                }
            }

            // 2. DRAW BLOOD WATER (Reaches edges of screen)
            ctx.fillStyle = '#b80000'; // Bright blood sea color
            ctx.beginPath();
            
            // Start at bottom left
            ctx.moveTo(0, canvas.height); 
            
            // The baseline height of the water (30% from the bottom)
            let waterHeight = canvas.height * 0.70; 

            // Draw the wave stretching from left border to right border
            for(let x = 0; x <= canvas.width; x += 10) {
                // Math.sin creates the undulating wave effect
                let y = waterHeight + Math.sin(x * 0.015 + waveTime) * 15; 
                ctx.lineTo(x, y);
            }
            
            // Draw down to bottom right, and close back to bottom left
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.fill();

            // Advance the wave animation
            waveTime += 0.05;

            // Loop animation
            requestAnimationFrame(drawFX);
        }
        drawFX();


        // --- TEXT ARRAY & INTERACTION LOGIC ---
        const textContainer = document.getElementById('text-container');
        const sceneBoat = document.getElementById('scene-boat');
        const sceneCross = document.getElementById('scene-cross');
        
        // Edit this array to change the sequence of texts displayed
        const textDatabase = [
            "Hey!",
            "¿Como estas?",
            "Recordando que hoy ya es septiembre",
            "(Dia de la prevencion suicida por cierto)", //Cut
            "Queria que te detengas un segundo,",
            "Para recordar quien eres.",
            "Quizas no estes pasando un buen momento,",
            "lo entiendo.", //Cut
            "Sin embargo quiero que te veas a ti mismo,",
            "Y a todo lo que lograste.",
            "Y que a pesar de todo, aun sigues aqui.",
            "Se que todo se siente pesado,", //Cut
            "2026 aun no ha acabado,",
            "Y aun asi fue un año dificil",
            "Posiblemente problemas familiares, dolores,",
            "quizas hasta muchas depresiones.", //Cut
            "Pero se que despues de todas las tormentas,",
            "siempre sale el Sol.",
            "Tu puedes,",
            "sigue empujando.",
            "Pronto veras como todo sale bien",
            "Eres amado.",
            "EL, te ama."
        ];

        let textIndex = 0;             // Tracks progress through textDatabase
        let displayedLines = [];       // Holds lines currently rendered on screen (max 4)
        let holdInterval;
        let isFinished = false;

        function addText() {
            if (isFinished) return;

            // Trigger the transition once all texts are finished
            if (textIndex >= textDatabase.length) {
                endScene();
                return;
            }

            // If there are already 4 lines displayed, delete them
            // and start again from the top
            if (displayedLines.length >= 4) {
                displayedLines = [];
                textContainer.innerHTML = "";
            }

            // Get the next text
            const newText = textDatabase[textIndex];
            textIndex++;

            // Save it
            displayedLines.push(newText);

            // Create a separate element for this line
            const line = document.createElement("span");
            line.className = "text-line";
            line.textContent = newText;

            // Add the line to the container
            textContainer.appendChild(line);

            // Add a line break after it
            textContainer.appendChild(document.createElement("br"));
        }


        function startHolding(e) {
            // Prevents screen dragging/zooming on mobile
            if(e.type === 'touchstart') e.preventDefault(); 
            if (isFinished) return;

            addText(); 
            // Progresses text automatically while holding (interval of 800ms)
            holdInterval = setInterval(addText, 800); 
        }

        function stopHolding() {
            clearInterval(holdInterval);
        }

        function endScene() {
            isFinished = true;
            stopHolding();
            
            // Cross transition
            sceneBoat.classList.add('fade-out');
            setTimeout(() => {
                sceneCross.classList.add('fade-in');
            }, 1200);
        }

        // Mouse Events
        window.addEventListener('mousedown', startHolding);
        window.addEventListener('mouseup', stopHolding);
        window.addEventListener('mouseleave', stopHolding);

        // Touch Events
        window.addEventListener('touchstart', startHolding, { passive: false });
        window.addEventListener('touchend', stopHolding);
        window.addEventListener('touchcancel', stopHolding);

    </script>
</body>
</html>
